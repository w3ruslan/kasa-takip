<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<title>Prêts</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f5f8; --kart:#fff; --yazi:#161c27; --gri:#6f7888; --acik:#a3abb8; --cizgi:#e8ebf0;
  --tur:#e0702a; --turA:#fdf1e8; --mavi:#2f6be0; --maviA:#ebf1fd;
  --kir:#d23b3b; --kirA:#fdeeee; --yes:#15894c; --yesA:#e7f6ee; --mor:#7a4fd6; --morA:#f1ecfc;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 clamp(16px, 2.5vw, 40px) 48px}
button,input,select,textarea{font:inherit;color:inherit}
.r{font-variant-numeric:tabular-nums}

/* --- en-tete + onglets --- */
.ust{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 14px}
.sekmeler{display:flex;background:#e6e9ef;border-radius:12px;padding:3px;gap:2px}
.sekmeler a{padding:7px 16px;border-radius:9px;font-weight:700;font-size:17px;color:var(--gri);text-decoration:none}
.sekmeler a.aktif{background:var(--kart);color:var(--yazi);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bosluk{flex:1}
.durum{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gri);white-space:nowrap}
.nokta{width:8px;height:8px;border-radius:50%;background:var(--acik)}
.nokta.ok{background:#22b066} .nokta.bekle{background:#f0b429} .nokta.hata{background:var(--kir)}
.pin input{text-align:center;letter-spacing:.3em;font-size:24px}

/* --- total --- */
.sonuc{background:var(--kart);border-radius:20px;padding:20px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;border:2px solid #d9cdf5;background:linear-gradient(0deg,var(--morA),#fff)}
.sonuc .sol{flex:1;min-width:220px}
.etk{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gri);text-transform:uppercase}
.sonuc .tutar{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--mor)}
.sonuc .alt{color:var(--gri);font-size:13px;margin-top:4px}
.dugmeGrup{display:flex;gap:8px;flex-wrap:wrap}

/* --- cartes societes --- */
.sirketler{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.skart{background:var(--kart);border-radius:18px;padding:16px 18px;border-top:4px solid var(--cizgi);cursor:pointer;transition:box-shadow .15s}
.skart:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.skart.secili{outline:2px solid var(--mavi)}
.skart h2{margin:0;font-size:15px;letter-spacing:.02em}
.skart .tip{font-size:12px;color:var(--gri);margin-bottom:10px}
.skart .kalan{font-size:30px;font-weight:800;letter-spacing:-.01em}
.skart .kalanEtk{font-size:12px;color:var(--gri);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.skart .satirlar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--cizgi);font-size:14px}
.skart .satirlar span{color:var(--gri)}
.skart .satirlar b{text-align:right}
.bar{height:6px;background:var(--cizgi);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yes);border-radius:4px}

/* --- mouvements --- */
.bolum{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:26px 2px 10px}
.bolum h2{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--gri)}
.filtre{display:flex;gap:6px;flex-wrap:wrap}
.filtre button{border:1px solid var(--cizgi);background:var(--kart);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--gri)}
.filtre button.aktif{background:var(--yazi);color:#fff;border-color:var(--yazi)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--yazi);color:#fff}
.btn.pret{background:var(--mor)} .btn.fatura{background:var(--mavi)} .btn.geri{background:var(--yes)}
.btn.ince{background:#fff;color:var(--yazi);border:1px solid var(--cizgi);font-weight:600}
.btn.sil{background:var(--kirA);color:var(--kir)}

.tablo{background:var(--kart);border-radius:18px;overflow:hidden}
.satir{display:grid;grid-template-columns:110px 1.3fr 150px 1.6fr 130px 130px;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid var(--cizgi);cursor:pointer}
.satir:hover{background:#fafbff}
.satir.bas{background:#fafbfc;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gri);border-top:0;cursor:default}
.satir .sag{text-align:right}
.satir .tarih{font-weight:600}
.satir .not{color:var(--gri);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.satir .not b{color:var(--yazi);font-weight:600}
.filtreler{display:flex;gap:10px;flex-wrap:wrap}
#faturaAlan{background:var(--maviA);border-radius:12px;padding:2px 12px 12px;margin-top:12px}
.rozet{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.rozet.pret{background:var(--morA);color:var(--mor)} .rozet.fatura{background:var(--maviA);color:var(--mavi)} .rozet.geri{background:var(--yesA);color:var(--yes)}
.tutar.pret{color:var(--mor);font-weight:700} .tutar.fatura{color:var(--mavi);font-weight:700} .tutar.geri{color:var(--yes);font-weight:700}
.yil{padding:8px 16px;background:#fafbfc;border-top:1px solid var(--cizgi);font-size:12px;font-weight:700;color:var(--gri);letter-spacing:.05em;display:flex;justify-content:space-between}
.bos{padding:30px 16px;text-align:center;color:var(--gri)}
.sirketAd{font-weight:600}
.mob{display:none;font-style:normal}
.sirketAd small{display:block;color:var(--gri);font-weight:400;font-size:12px}

.araclar{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;margin-top:24px}
.araclar button{border:0;background:none;color:var(--gri);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.dipnot{text-align:center;font-size:12px;color:var(--acik);margin-top:6px}

/* --- fenetre --- */
.perde{position:fixed;inset:0;background:rgba(18,24,34,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.perde.acik{display:flex}
.pencere{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:380px;max-height:94vh;overflow-y:auto}
.pencere h3{margin:0;font-size:18px}
.pencere label{display:block;font-size:13px;color:var(--gri);margin:10px 0 4px}
.pencere input,.pencere select,.pencere textarea{width:100%;padding:11px;border:1px solid #d5d9e0;border-radius:10px;font-size:16px;background:#fff}
.pencere textarea{resize:vertical;min-height:60px}
.pencere #fTutar{font-size:22px;font-weight:700}
.turSec{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.turSec button{border:2px solid var(--cizgi);background:#fff;border-radius:12px;padding:10px 8px;font-weight:700;cursor:pointer;color:var(--gri);font-size:14px}
.turSec button.aktif.pret{border-color:var(--mor);background:var(--morA);color:var(--mor)}
.turSec button.aktif.fatura{border-color:var(--mavi);background:var(--maviA);color:var(--mavi)}
.turSec button.aktif.geri{border-color:var(--yes);background:var(--yesA);color:var(--yes)}
.turSec button small{display:block;font-weight:500;font-size:11px}
.ikiAlan{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dugmeler{display:flex;gap:8px;margin-top:16px}
.dugmeler .btn{flex:1;padding:12px}
.dugmeler .btn.sil{flex:0 0 auto}
.hata{color:var(--kir);font-size:13px;min-height:18px;margin-top:6px}

@media (max-width:820px){
  .sirketler{grid-template-columns:1fr}
  .sonuc .tutar{font-size:36px}
  .dugmeGrup{width:100%}
  .dugmeGrup .btn{flex:1;padding:13px 10px}
  .satir.bas{display:none}
  .satir{grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px}
  .satir .tarih{grid-column:1;font-size:13px;color:var(--gri);font-weight:500}
  .satir .tur{grid-column:2;grid-row:1;text-align:right}
  .satir .sirketAd{grid-column:1}
  .satir .tutar{grid-column:2;grid-row:2;text-align:right;font-size:17px}
  .satir .not{grid-column:1/3}
  .satir .bakiye{grid-column:1/3;text-align:left;font-size:12px;color:var(--gri)}
  .satir .not:empty{display:none}
  .mob{display:inline}
}
</style>
</head>
<body>

<div class="ust">
  <nav class="sekmeler">
    <a href="./">Caisse</a>
    <a class="aktif" href="#">Prêts</a>
  </nav>
  <div class="bosluk"></div>
  <div class="durum"><span class="nokta" id="nokta"></span><span id="durumYazi">…</span></div>
</div>

<div class="sonuc">
  <div class="sol">
    <div class="etk">Total que les sociétés me doivent</div>
    <div class="tutar r" id="genelKalan">0,00 €</div>
    <div class="alt r" id="genelAlt"></div>
  </div>
  <div class="dugmeGrup">
    <button class="btn pret" onclick="formAc(null,'pret')">+ Nouveau prêt</button>
    <button class="btn fatura" onclick="formAc(null,'fatura')">+ Facture payée</button>
    <button class="btn geri" onclick="formAc(null,'geri')">+ Remboursement</button>
  </div>
</div>

<div class="sirketler" id="sirketler"></div>

<div class="bolum">
  <h2>Historique des mouvements</h2>
  <div class="filtreler"><div class="filtre" id="filtreTur"></div><div class="filtre" id="filtre"></div></div>
</div>
<div class="tablo" id="tablo"></div>

<div class="araclar">
  <button onclick="csvIndir()">Exporter vers Excel</button>
  <button onclick="yedekIndir()">Télécharger une sauvegarde</button>
  <button onclick="document.getElementById('dosya').click()">Restaurer une sauvegarde</button>
  <button onclick="senkron()">Synchroniser</button>
  <button onclick="pinUnut()">Oublier le PIN</button>
  <input type="file" id="dosya" accept=".json,application/json" style="display:none" onchange="yedekYukle(this)">
</div>
<div class="dipnot">Touchez une ligne pour la modifier. Chaque modification est enregistrée sur cet appareil et dans le cloud ; sans internet, elle est mise en attente.</div>

<div class="perde" id="perde" onclick="if(event.target===this)kapat()">
  <div class="pencere">
    <h3 id="fBaslik">Mouvement</h3>
    <div class="turSec">
      <button class="pret" data-tur="pret" onclick="turSec('pret')">Prêt<small>je prête de l'argent</small></button>
      <button class="fatura" data-tur="fatura" onclick="turSec('fatura')">Facture<small>je paie une facture pour elle</small></button>
      <button class="geri" data-tur="geri" onclick="turSec('geri')">Remboursement<small>elle me rembourse</small></button>
    </div>
    <label>Société</label>
    <select id="fSirket"></select>
    <div id="faturaAlan">
      <label>Payé à (fournisseur)</label>
      <input id="fKime" list="kimeListe" autocomplete="off" placeholder="ex. EDF, Trésor public, artisan…">
      <datalist id="kimeListe"></datalist>
      <label>Objet de la facture</label>
      <input id="fKonu" autocomplete="off" placeholder="ex. électricité septembre, taxe foncière 2026…">
      <label>N° de facture (facultatif)</label>
      <input id="fNo" autocomplete="off">
    </div>
    <label>Montant (€)</label>
    <input id="fTutar" inputmode="decimal" autocomplete="off" placeholder="0,00" onkeydown="if(event.key==='Enter')kaydet()">
    <div class="ikiAlan">
      <div><label>Date</label><input id="fTarih" type="date"></div>
      <div><label>Moyen</label><select id="fYol">
        <option>Virement</option><option>Chèque</option><option>Espèces</option><option>Prélèvement</option><option>Autre</option>
      </select></div>
    </div>
    <label>Note (facultatif)</label>
    <textarea id="fNot" placeholder="ex. paiement taxe foncière, travaux toiture…"></textarea>
    <div class="hata" id="fHata"></div>
    <div class="dugmeler">
      <button class="btn sil" id="fSil" onclick="sil()">Supprimer</button>
      <button class="btn ince" onclick="kapat()">Annuler</button>
      <button class="btn" onclick="kaydet()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="perde" id="pinPerde">
  <div class="pencere pin" style="text-align:center">
    <h3>Code PIN</h3>
    <input id="pinGiris" type="password" inputmode="numeric" autocomplete="off" style="margin-top:12px" onkeydown="if(event.key==='Enter')pinGonder()">
    <div class="hata" id="pinHata"></div>
    <div class="dugmeler"><button class="btn" onclick="pinGonder()">Entrer</button></div>
  </div>
</div>

<script>
// ============================================================================
//  AYARLAR
// ============================================================================
const SIRKETLER = [
  { id:"sci", ad:"SCI NESLI ASLI",   tip:"Société civile immobilière", renk:"#7a4fd6" },
  { id:"ei",  ad:"EI GURBET YILMAZ", tip:"Entreprise individuelle",    renk:"#e0702a" },
];
const TUR = { pret:"Prêt", fatura:"Facture payée", geri:"Remboursement" };
const borcMu = t => t !== "geri";   // pret + fatura = la societe me doit
const WORKER_URL = "https://kasa-data.w3ruslan-8c5.workers.dev/?f=pret";
const LS_VERI = "pretVeri", LS_BEKLE = "pretBekliyor", LS_PIN = "kasaPin";   // PIN = meme PIN que la caisse

// ============================================================================
//  VERI  — { v:1, hareketler:[{id, t, sirket, tur, tarih, tutar, yol, not, sil?}] }
//  (silinen kayit "sil:true" ile kalir; senkronda id + t ile birlestirilecek)
// ============================================================================
function yukle(){
  try { const d = JSON.parse(localStorage.getItem(LS_VERI) || "null"); if (d && Array.isArray(d.hareketler)) return d; } catch(e){}
  return { v:1, hareketler:[] };
}
let veri = yukle();
function yerelKaydet(){ try { localStorage.setItem(LS_VERI, JSON.stringify(veri)); } catch(e){} }
function yeniId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function bugun(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const aktifler = () => veri.hareketler.filter(h => !h.sil);

const EUR = new Intl.NumberFormat("fr-FR", { style:"currency", currency:"EUR" });
const para = x => EUR.format(x || 0);
const tarihYaz = s => { const [y,m,d] = s.split("-"); return `${d}/${m}/${y}`; };
const kacis = s => String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const sirketBul = id => SIRKETLER.find(s => s.id === id) || { ad:id, tip:"", renk:"#999" };

function sirala(a, b){ return a.tarih.localeCompare(b.tarih) || (a.olusturma||0) - (b.olusturma||0); }

function ozet(sirketId){
  let verilen = 0, fatura = 0, donen = 0, son = null;
  for (const h of aktifler()) if (!sirketId || h.sirket === sirketId) {
    if (h.tur === "pret") verilen += h.tutar; else if (h.tur === "fatura") fatura += h.tutar; else donen += h.tutar;
    if (!son || h.tarih > son.tarih) son = h;
  }
  return { verilen, fatura, donen, borc: verilen + fatura, kalan: verilen + fatura - donen, son };
}

// ============================================================================
//  CIZIM
// ============================================================================
let filtre = "", filtreTur = "";

function ciz(){
  const g = ozet("");
  document.getElementById("genelKalan").textContent = para(g.kalan);
  document.getElementById("genelAlt").textContent =
    `Prêté ${para(g.verilen)} · factures payées ${para(g.fatura)} · remboursé ${para(g.donen)}`;

  document.getElementById("sirketler").innerHTML = SIRKETLER.map(s => {
    const o = ozet(s.id);
    const oran = o.borc > 0 ? Math.min(100, o.donen / o.borc * 100) : 0;
    return `<div class="skart ${filtre===s.id?"secili":""}" style="border-top-color:${s.renk}" onclick="filtreSec('${filtre===s.id?"":s.id}')">
      <h2>${kacis(s.ad)}</h2>
      <div class="tip">${kacis(s.tip)}</div>
      <div class="kalanEtk">Reste dû</div>
      <div class="kalan r" style="color:${o.kalan < 0 ? "var(--kir)" : s.renk}">${para(o.kalan)}</div>
      <div class="bar"><i style="width:${oran.toFixed(1)}%"></i></div>
      <div class="satirlar r">
        <span>Prêté (argent)</span><b>${para(o.verilen)}</b>
        <span>Factures payées</span><b>${para(o.fatura)}</b>
        <span>Remboursé</span><b>${para(o.donen)}</b>
        <span>Dernier mouvement</span><b>${o.son ? tarihYaz(o.son.tarih) : "–"}</b>
      </div>
    </div>`;
  }).join("");

  document.getElementById("filtre").innerHTML =
    [{ id:"", ad:"Toutes" }, ...SIRKETLER].map(s =>
      `<button class="${filtre===s.id?"aktif":""}" onclick="filtreSec('${s.id}')">${kacis(s.ad)}</button>`).join("");
  document.getElementById("filtreTur").innerHTML =
    [["","Tout"],["pret","Prêts"],["fatura","Factures"],["geri","Remboursements"]].map(([id, ad]) =>
      `<button class="${filtreTur===id?"aktif":""}" onclick="filtreTur='${id}';ciz()">${ad}</button>`).join("");

  // solde courant par societe (ordre chronologique)
  const bakiye = {}, sonra = {};
  for (const h of aktifler().sort(sirala)) {
    bakiye[h.sirket] = (bakiye[h.sirket] || 0) + (borcMu(h.tur) ? h.tutar : -h.tutar);
    sonra[h.id] = bakiye[h.sirket];
  }
  const liste = aktifler().filter(h => (!filtre || h.sirket === filtre) && (!filtreTur || h.tur === filtreTur)).sort(sirala).reverse();

  let html = `<div class="satir bas"><div>Date</div><div>Société</div><div>Type</div><div>Note</div><div class="sag">Montant</div><div class="sag">Solde société</div></div>`;
  if (!liste.length) html += `<div class="bos">Aucun mouvement pour l'instant.<br>Ajoutez un prêt ou une facture payée avec les boutons ci-dessus.</div>`;
  let yil = "";
  for (const h of liste) {
    const y = h.tarih.slice(0,4);
    if (y !== yil) {
      yil = y;
      const yh = liste.filter(x => x.tarih.startsWith(y));
      const top = t => yh.filter(x => x.tur === t).reduce((a,x) => a + x.tutar, 0);
      const parca = [["pret","prêté"],["fatura","factures"],["geri","remboursé"]].filter(([t]) => top(t)).map(([t,ad]) => `${ad} ${para(top(t))}`);
      html += `<div class="yil r"><span>${y}</span><span>${parca.join(" · ")}</span></div>`;
    }
    const s = sirketBul(h.sirket);
    html += `<div class="satir r" onclick="formAc('${h.id}')">
      <div class="tarih">${tarihYaz(h.tarih)}</div>
      <div class="sirketAd"><span style="color:${s.renk}">●</span> ${kacis(s.ad)}</div>
      <div class="tur"><span class="rozet ${h.tur}">${{ pret:"↗ ", fatura:"🧾 ", geri:"↙ " }[h.tur]}${TUR[h.tur]}</span></div>
      <div class="not">${aciklama(h)}</div>
      <div class="tutar ${h.tur} sag">${borcMu(h.tur) ? "+" : "−"}${para(h.tutar)}</div>
      <div class="bakiye sag"><i class="mob">solde après : </i>${para(sonra[h.id])}</div>
    </div>`;
  }
  document.getElementById("tablo").innerHTML = html;
}
function filtreSec(id){ filtre = id; ciz(); }
function aciklama(h){
  const bas = h.tur === "fatura"
    ? `<b>${kacis(h.konu)}</b> → ${kacis(h.kime)}${h.no ? " · n° " + kacis(h.no) : ""}`
    : "";
  const son = kacis([h.yol, h.not].filter(Boolean).join(" · "));
  return [bas, son].filter(Boolean).join(" · ");
}

// ============================================================================
//  FORMULAIRE
// ============================================================================
let duzId = null, duzTur = "pret";
document.getElementById("fSirket").innerHTML = SIRKETLER.map(s => `<option value="${s.id}">${kacis(s.ad)}</option>`).join("");

function turSec(t){
  duzTur = t;
  document.querySelectorAll(".turSec button").forEach(b => b.classList.toggle("aktif", b.dataset.tur === t));
  document.getElementById("faturaAlan").style.display = t === "fatura" ? "" : "none";
}
function formAc(id, tur){
  duzId = id;
  const h = id ? veri.hareketler.find(x => x.id === id) : null;
  document.getElementById("fBaslik").textContent = h ? "Modifier le mouvement" : "Nouveau mouvement";
  turSec(h ? h.tur : (tur || "pret"));
  document.getElementById("fSirket").value = h ? h.sirket : (filtre || SIRKETLER[0].id);
  document.getElementById("fTutar").value = h ? String(h.tutar).replace(".", ",") : "";
  document.getElementById("fTarih").value = h ? h.tarih : bugun();
  document.getElementById("fYol").value = h ? (h.yol || "Virement") : "Virement";
  document.getElementById("fNot").value = h ? (h.not || "") : "";
  document.getElementById("fKime").value = h ? (h.kime || "") : "";
  document.getElementById("fKonu").value = h ? (h.konu || "") : "";
  document.getElementById("fNo").value = h ? (h.no || "") : "";
  document.getElementById("kimeListe").innerHTML = [...new Set(aktifler().map(x => x.kime).filter(Boolean))]
    .sort().map(k => `<option value="${kacis(k)}">`).join("");
  document.getElementById("fSil").style.display = h ? "" : "none";
  document.getElementById("fHata").textContent = "";
  document.getElementById("perde").classList.add("acik");
  setTimeout(() => document.getElementById(duzTur === "fatura" && !h ? "fKime" : "fTutar").focus(), 50);
}
function kapat(){ document.getElementById("perde").classList.remove("acik"); }

function sayiOku(s){
  s = String(s).replace(/\s|€/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  return Number(s);
}
function kaydet(){
  const tutar = Math.round(sayiOku(document.getElementById("fTutar").value) * 100) / 100;
  const tarih = document.getElementById("fTarih").value;
  const hata = m => document.getElementById("fHata").textContent = m;
  if (!(tutar > 0)) return hata("Saisissez un montant supérieur à 0.");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tarih)) return hata("Choisissez une date.");
  const fat = duzTur === "fatura";
  const kime = document.getElementById("fKime").value.trim(), konu = document.getElementById("fKonu").value.trim();
  if (fat && !kime) return hata("Indiquez à qui la facture a été payée.");
  if (fat && !konu) return hata("Indiquez l'objet de la facture.");
  const alan = {
    sirket: document.getElementById("fSirket").value, tur: duzTur, tarih, tutar,
    yol: document.getElementById("fYol").value, not: document.getElementById("fNot").value.trim(), t: Date.now(),
    kime: fat ? kime : "", konu: fat ? konu : "", no: fat ? document.getElementById("fNo").value.trim() : "",
  };
  if (duzId) Object.assign(veri.hareketler.find(x => x.id === duzId), alan);
  else veri.hareketler.push({ id: yeniId(), olusturma: Date.now(), ...alan });
  kapat(); degisti();
}
function sil(){
  if (!duzId || !confirm("Supprimer ce mouvement ?")) return;
  const h = veri.hareketler.find(x => x.id === duzId);
  h.sil = true; h.t = Date.now();
  kapat(); degisti();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") kapat(); });

// ============================================================================
//  EXPORT / SAUVEGARDE
// ============================================================================
function indir(ad, icerik, tip){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([icerik], { type: tip }));
  a.download = ad; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function csvIndir(){
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const satirlar = [["Date","Société","Type","Montant","Payé à","Objet facture","N° facture","Moyen","Note"].map(q).join(";")];
  for (const h of aktifler().sort(sirala))
    satirlar.push([tarihYaz(h.tarih), sirketBul(h.sirket).ad, TUR[h.tur],
      (borcMu(h.tur) ? h.tutar : -h.tutar).toFixed(2).replace(".", ","), h.kime, h.konu, h.no, h.yol, h.not].map(q).join(";"));
  indir(`prets_${bugun()}.csv`, "﻿" + satirlar.join("\r\n"), "text/csv;charset=utf-8");
}
function yedekIndir(){ indir(`prets_sauvegarde_${bugun()}.json`, JSON.stringify(veri, null, 1), "application/json"); }
function yedekYukle(inp){
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t);
    if (!d || !Array.isArray(d.hareketler)) throw 0;
    if (!confirm(`Restaurer ${d.hareketler.filter(h => !h.sil).length} mouvements ? Les données actuelles seront remplacées.`)) return;
    // restauration : les mouvements absents de la sauvegarde sont marques supprimes
    const ids = new Set(d.hareketler.map(h => h.id)), an = Date.now();
    for (const h of veri.hareketler) if (!ids.has(h.id) && !h.sil) d.hareketler.push({ ...h, sil:true, t: an });
    for (const h of d.hareketler) h.t = Math.max(h.t || 0, an);
    veri = { v:1, hareketler: d.hareketler }; degisti();
  }).catch(() => alert("Fichier de sauvegarde invalide.")).finally(() => inp.value = "");
}

// ============================================================================
//  SENKRONIZASYON  (Cloudflare worker -> prets.json, meme PIN que la caisse)
// ============================================================================
function bekliyorMu(){ try { return localStorage.getItem(LS_BEKLE) === "1"; } catch(e){ return false; } }
function bekliyor(v){ try { v ? localStorage.setItem(LS_BEKLE,"1") : localStorage.removeItem(LS_BEKLE); } catch(e){} }
function pinAl(){ try { return localStorage.getItem(LS_PIN) || ""; } catch(e){ return ""; } }
function durum(tip, yazi){ document.getElementById("nokta").className = "nokta " + tip; document.getElementById("durumYazi").textContent = yazi; }
function saat(){ return new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }

function birlestir(a, b){
  const m = new Map();
  for (const h of [...(a.hareketler||[]), ...(b.hareketler||[])]) { const o = m.get(h.id); if (!o || (h.t||0) > (o.t||0)) m.set(h.id, h); }
  return { v:1, hareketler: [...m.values()] };
}
const imza = d => JSON.stringify([...d.hareketler].sort((x,y) => x.id < y.id ? -1 : 1).map(h => [h.id, h.t || 0]));

async function uzakOku(){
  const r = await fetch(WORKER_URL + "&t=" + Date.now(), { cache:"no-store", headers:{ "X-Pin": pinAl() } });
  if (r.status === 401) { const e = new Error("pin"); e.pin = true; throw e; }
  if (r.status === 404) { const e = new Error("worker"); e.worker = true; throw e; }
  if (!r.ok) throw new Error("lecture " + r.status);
  const d = await r.json();
  return (d && Array.isArray(d.hareketler)) ? d : { v:1, hareketler:[] };
}
async function uzakYaz(d){
  const r = await fetch(WORKER_URL, { method:"POST", headers:{ "Content-Type":"application/json", "X-Pin": pinAl() }, body: JSON.stringify(d) });
  if (r.status === 401) { const e = new Error("pin"); e.pin = true; throw e; }
  if (!r.ok) throw new Error("ecriture " + r.status);
}
let senkronda = false, tekrar = false, zamanlayici = null;
async function senkron(){
  if (!pinAl()) { pinSor(); return; }
  if (senkronda) { tekrar = true; return; }
  senkronda = true; durum("bekle", "Synchronisation…");
  try {
    const uzak = await uzakOku();
    veri = birlestir(veri, uzak);
    if (imza(veri) !== imza(uzak)) await uzakYaz(veri);
    yerelKaydet(); bekliyor(false);
    durum("ok", "Synchronisé · " + saat()); ciz();
  } catch (e) {
    if (e.pin) { try { localStorage.removeItem(LS_PIN); } catch(_){} pinSor("PIN incorrect"); durum("hata", "PIN requis"); }
    else if (e.worker) durum("hata", "Cloud pas encore activé · données de cet appareil");
    else durum("hata", bekliyorMu() ? "Hors ligne · modifications en attente sur cet appareil" : "Pas de connexion · données de cet appareil affichées");
  } finally { senkronda = false; if (tekrar) { tekrar = false; senkron(); } }
}
function degisti(){
  yerelKaydet(); bekliyor(true); ciz(); durum("bekle", "Enregistrement…");
  clearTimeout(zamanlayici); zamanlayici = setTimeout(senkron, 700);
}
setInterval(() => { if (bekliyorMu() && !senkronda) senkron(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) senkron(); });
window.addEventListener("online", senkron);

function pinSor(hata){
  document.getElementById("pinHata").textContent = hata || "";
  document.getElementById("pinPerde").classList.add("acik");
  setTimeout(() => document.getElementById("pinGiris").focus(), 50);
}
function pinGonder(){
  const p = document.getElementById("pinGiris").value.trim(); if (!p) return;
  try { localStorage.setItem(LS_PIN, p); } catch(e){}
  document.getElementById("pinGiris").value = ""; document.getElementById("pinPerde").classList.remove("acik");
  senkron();
}
function pinUnut(){
  if (!confirm("Supprimer le PIN sur cet appareil ? Il faudra le saisir à nouveau.")) return;
  try { localStorage.removeItem(LS_PIN); } catch(e){} pinSor();
}

ciz();
durum("", "Connexion…");
senkron();
</script>
